name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hirekarlo_audit
          POSTGRES_PASSWORD: audit_only_password
          POSTGRES_DB: hirekarlo_audit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hirekarlo_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hirekarlo_audit:audit_only_password@localhost:5432/hirekarlo_audit
      AUTH_SECRET: ci-only-secret-never-use-in-production
      AUTH_TRUST_HOST: "true"
      E2E_AUDIT_DB: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Replay database migrations
        run: npm run db:deploy

      - name: Database security and SaaS integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        run: npm run test:e2e
        env:
          E2E_PRODUCTION: "true"
